name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read # Read access to repository contents

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          # Fail on any warning (a `sorry` is only a warning in Lean), so that a green run
          # means what README.md says a warning-free build means.
          build-args: "--wfail"
