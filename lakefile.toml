name = "MathInfra"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["MathInfra", "MathInfraTest", "MathApplied", "MathAppliedTest"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false # no Mathlib copyright header in this project
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.37.0-rc1"

[[lean_lib]]
name = "MathInfra"

[[lean_lib]]
name = "MathInfraTest"

[[lean_lib]]
name = "MathApplied"

[[lean_lib]]
name = "MathAppliedTest"
